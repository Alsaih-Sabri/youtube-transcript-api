<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: YouTube Crimson to Deep Ruby -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="45%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- Frosted Glass Upper Specular Reflection -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Subtle Inner Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Icon Elements -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- iOS Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Glass Specular Highlight -->
  <rect x="3" y="3" width="58" height="27" rx="13" fill="url(#glossGrad)"/>

  <!-- Play Symbol (Rounded Triangle) -->
  <path d="M22 17 C22 15.6 23.6 14.7 24.8 15.5 L39.6 24.8 C40.7 25.5 40.7 27.1 39.6 27.8 L24.8 37.1 C23.6 37.9 22 37.0 22 35.6 Z" 
        fill="#ffffff" filter="url(#subtleGlow)"/>

  <!-- Transcript / Audio Lines (Captions / Waveform Motif) -->
  <rect x="15" y="42" width="22" height="3.5" rx="1.75" fill="#ffffff" filter="url(#subtleGlow)"/>
  <rect x="40" y="42" width="9" height="3.5" rx="1.75" fill="#ffffff" fill-opacity="0.85" filter="url(#subtleGlow)"/>
  <rect x="15" y="48.5" width="13" height="3.5" rx="1.75" fill="#ffffff" fill-opacity="0.9" filter="url(#subtleGlow)"/>
  <rect x="31" y="48.5" width="18" height="3.5" rx="1.75" fill="#ffffff" filter="url(#subtleGlow)"/>
</svg>